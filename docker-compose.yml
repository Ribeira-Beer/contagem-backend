services:
  database:
    image: mysql:8.0
    container_name: contagem_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: contagem_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: contagem_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mysql_data: